# Passcryptum: two containers (ADR-0001) — Go binary (API + embedded SPA +
# SQLite) behind Caddy (automatic TLS for the ddns domain, security headers).
#
# Build from the repo root:
#   docker build -f backend/Dockerfile -t passcryptum-go .
# Onboard a key (generate one with: docker compose run --rm backend genkey):
#   docker compose run --rm backend add-public-key <b64pub>
#
# Before starting, set your domain in gateway/Caddyfile (Caddy gets the
# certificate itself — no certbot).

services:
  backend:
    image: passcryptum-go
    volumes:
      - pc_data:/data
    # Defense in depth: the process needs nothing but its socket and the data
    # volume, so drop every capability, freeze the filesystem (the binary and
    # SPA are baked into the image) and give SQLite a writable /tmp.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m

  gateway:
    image: caddy:2
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      # The Caddyfile imports this directory; without it Caddy refuses to
      # start ("File to import not found").
      - ./gateway/defaults:/etc/caddy/defaults:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "443:443"
      - "80:80"
    cap_drop:
      - ALL
    cap_add:
      # Caddy binds :80/:443, which are privileged ports inside the
      # container; nothing else from the default set is needed.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend

volumes:
  pc_data:
  caddy_data:
  caddy_config:
